name: Bold Dimensions CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bold-dimensions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run verify:identity
      - run: npm run build
